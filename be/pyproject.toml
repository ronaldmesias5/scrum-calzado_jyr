# ============================================================
# Archivo: be/pyproject.toml
# Descripción: Manifiesto del proyecto Python (dependencias, metadata, tooling).
#
# ¿Qué?
#   - [project]: Metadata (name, version, descripción, authors)
#   - dependencies: 15+ paquetes core (fastapi, sqlalchemy, pydantic, jose, passlib)
#   - [project.optional-dependencies]dev: Testing (pytest, httpx, pytest-cov)
#   - [tool.ruff]: Linting config (line-length 100, target py312)
#   - [tool.pytest.ini_options]: Test discovery (tests/, test_*.py)
#
# ¿Para qué?
#   - Declarar dependencias (pip install equivalente moderno)
#   - Versionado centralizado (1.0.0 en un solo lugar)
#   - Tooling config (Ruff, Pytest) sin archivos separados
#   - PEP 621 standard (pyproject.toml reemplaza setup.py)
#
# ¿Impacto?
#   CRÍTICO — pip install -e . lee este archivo para instalar deps.
#   Modificar dependencies requiere: rebuild Docker image.
#   requires-python=">=3.12": Backend NO funciona con Python <3.12 (type syntax).
#   Dependencias: requirements.txt (generado de aquí en Docker build)
# ============================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calzado-jyr"
version = "1.0.0"
description = "Sistema de gestión integral para CALZADO J&R"
requires-python = ">=3.12"
authors = [
    {name = "CALZADO J&R"}
]

dependencies = [
    # 🚀 Framework y servidor
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    
    # 🗄️ Base de datos y ORM
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    
    # 📋 Validación y configuración
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    
    # 🔐 Seguridad y autenticación
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "bcrypt>=4.0.0,<4.1.0",
    
    # 📧 Email
    "aiosmtplib>=3.0.0",
]

[project.optional-dependencies]
dev = [
    # 🧪 Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
    
    # 🔍 Linting y formateo
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Baseline de violaciones preexistentes (deuda técnica heredada, no introducida
# por cambios nuevos). E711/E712: el codebase usa `== None`/`== True` por
# convención (SQLAlchemy lo traduce a IS NULL). F821: forward reference string
# de SQLAlchemy (Mapped["User"]) — falso positivo. El resto son casos únicos
# heredados que se corrigen en refactors futuros.
ignore = [
    "E402",   # import no al inicio de archivo (main.py:199)
    "E701",   # múltiples statements en una línea (services/auth.py:63)
    "E711",   # comparación con None (convención del codebase)
    "E712",   # comparación con True/False (convención del codebase)
    "E722",   # bare except (services/auth.py:66)
    "F821",   # forward reference de SQLAlchemy (models/password_reset_token.py:79)
    "F841",   # variables locales asignadas sin uso (baseline)
    "B008",   # Depends() en defaults de FastAPI (patrón estándar de FastAPI)
    "BLE001", # blind exception en handlers genéricos (baseline heredado)
    "C401",   # unnecessary generator (baseline heredado)
    "C414",   # unnecessary list() in sorted() (baseline heredado)
    "DTZ003", # datetime.utcnow() (baseline heredado)
    "FURB157",# Decimal constructor verbose (baseline heredado)
    "G201",   # logging .error con exc_info (baseline heredado)
    "I001",   # import block sorting (baseline heredado)
    "PIE790", # unnecessary pass (baseline heredado)
    "PIE810", # startswith with tuple (baseline heredado)
    "RUF010", # explicit conversion flag (baseline heredado)
    "RUF013", # PEP 484 implicit Optional (baseline heredado)
    "RUF022", # __all__ not sorted (baseline heredado)
    "RUF100", # unused noqa directive (baseline heredado)
    "S110",   # try-except-pass (baseline heredado)
    "TC005",  # empty TYPE_CHECKING block (baseline heredado)
    "TRY201", # raise con nombre de exception (baseline heredado)
    "UP006",  # use list instead of typing.List (baseline heredado)
    "UP017",  # datetime.UTC alias (baseline heredado — usa timezone.utc)
    "UP035",  # typing.List deprecated (baseline heredado)
    "UP045",  # X | None type annotations (baseline heredado — usa Optional)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
