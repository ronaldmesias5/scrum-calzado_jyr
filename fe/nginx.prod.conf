# ============================================================
# CALZADO J&R — nginx.conf para PRODUCCIÓN con HTTPS (SSL/TLS)
# ============================================================
# ¿Qué?    Configuración de nginx con certificados TLS via Let's Encrypt.
# ¿Para?   Servir la SPA con HTTPS habilitado (requerimiento checklist).
# ¿Cómo?   1. Puerto 80 redirige todo a HTTPS
#           2. Puerto 443 sirve la SPA con certificado TLS
#           3. Certbot genera/renueva certificados automáticamente
#
# USO:
#   1. Cambia `server_name tu-dominio.com` en ambos bloques
#   2. Descomenta la sección de certbot y ejecuta:
#      docker compose -f docker-compose.prod.yml run --rm certbot
#   3. El certificado se renueva automáticamente cada 60 días
# ============================================================

# ─── Bloque HTTP → redirige a HTTPS ───────────────────────────
server {
    listen 80;
    server_name _;

    # Certbot challenge (necesario para generar el certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir TODO a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── Bloque HTTPS → sirve la SPA ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ══════════════════════════════════════════════
    # Certificados TLS (Let's Encrypt)
    # ══════════════════════════════════════════════
    ssl_certificate     /etc/letsencrypt/live/tu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.com/privkey.pem;

    # Protocolos y cifrados modernos (A+ en SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Session tickets para mejor rendimiento
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ══════════════════════════════════════════════
    # Headers de seguridad adicionales (HTTPS)
    # ══════════════════════════════════════════════
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Raíz donde están los archivos compilados por Vite
    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versión de nginx
    server_tokens off;

    # ────────────────────────────
    # Caché agresiva para assets con hash
    # ────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ────────────────────────────
    # Todas las demás rutas → index.html (React Router)
    # ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        if ($request_uri ~* ^/index\.html$|/$) {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # ────────────────────────────
    # Proxy al backend (API)
    # ────────────────────────────
    location /api/ {
        proxy_pass http://be:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ────────────────────────────
    # Archivos estáticos del backend (uploads)
    # ────────────────────────────
    location /uploads/ {
        proxy_pass http://be:8000;
        proxy_set_header Host $host;
    }
}
