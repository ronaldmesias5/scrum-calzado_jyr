sonar.projectKey=ronaldmesias5_scrum-calzado_jyr
sonar.organization=ronaldmesias5
sonar.sources=.

# Código de pruebas: se analiza aparte y no cuenta como código fuente
sonar.tests=be/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,be/tests/**

# Reportes de cobertura generados en el workflow de SonarCloud
sonar.python.coverage.reportPaths=be/coverage.xml
sonar.javascript.lcov.reportPaths=fe/coverage/lcov.info

# Opciones adicionales de exclusión de archivos
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/dist/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/*.pyc,**/*.md,docs/**,.agents/**,.opencode/**,be/coverage.xml,fe/coverage/**
