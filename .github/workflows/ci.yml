name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jyr_user
          POSTGRES_PASSWORD: JyrPassword123!
          POSTGRES_DB: calzado_jyr_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jyr_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jyr_user:JyrPassword123!@localhost:5432/calzado_jyr_db
      SECRET_KEY: ci-secret-key-for-calzado-jyr-2026-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: test
      # Mail settings required by Settings() in be/app/config.py (no .env in CI)
      MAIL_SERVER: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-password
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check app/

      - name: Run tests
        run: uv run pytest -v

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc -b

      - name: Tests
        run: pnpm test