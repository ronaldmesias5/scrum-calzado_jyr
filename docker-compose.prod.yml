# ============================================================
# CALZADO J&R — Docker Compose para PRODUCCIÓN con HTTPS
# ============================================================
# ¿Qué?    Versión de producción con nginx HTTPS + Let's Encrypt.
# ¿Para?   Desplegar el sistema con certificado TLS válido.
# ¿Cómo?
#   1. cp .env.example .env  (configurar variables de producción)
#   2. Editar nginx.prod.conf: cambiar tu-dominio.com por tu dominio real
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. docker compose -f docker-compose.prod.yml run --rm certbot
#   5. Verificar: https://tu-dominio.com
#
# NOTA: En desarrollo usa docker-compose.yml (sin HTTPS).
# ============================================================

services:
  # ──────────────────────────────────────────────────────────
  # 🐘 db — PostgreSQL 17
  # ──────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: calzado_jyr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - calzado_jyr_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # NO exponer puerto en producción — solo accesible desde red interna

  # ──────────────────────────────────────────────────────────
  # ⚡ be — Backend FastAPI
  # ──────────────────────────────────────────────────────────
  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: calzado_jyr_be
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # NO exponer puerto en producción — nginx hace proxy

  # ──────────────────────────────────────────────────────────
  # 🌐 nginx — Reverse Proxy con HTTPS
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: calzado_jyr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./fe/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./fe/dist:/usr/share/nginx/html:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - be
      - fe

  # ──────────────────────────────────────────────────────────
  # 🖥️ fe — Frontend Build (solo compila, nginx sirve)
  # ──────────────────────────────────────────────────────────
  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: calzado_jyr_fe
    # No necesita puertos — nginx sirve los archivos compilados

  # ──────────────────────────────────────────────────────────
  # 🔒 certbot — Let's Encrypt SSL
  # ──────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: calzado_jyr_certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Para generar el certificado inicial:
    # docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot --webroot-path=/var/www/certbot -d tu-dominio.com --email tu@email.com --agree-tos --no-eff-email
    #
    # Para renovar (cron job cada 12h):
    # docker compose -f docker-compose.prod.yml run --rm certbot renew

volumes:
  calzado_jyr_data:
  certbot-conf:
  certbot-www:
