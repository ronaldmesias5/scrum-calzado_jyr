# ════════════════════════════════════════
# 📄 Orquesta los 3 servicios del sistema: BD, BE y FE
# ════════════════════════════════════════

services:
  # ──────────────────────────────────────────────────────────
  # 🐘 db — PostgreSQL 17: motor de BD relacional persistente
  #     Imagen alpine mínima; el healthcheck bloquea al backend
  #     hasta que la BD esté lista (evita errores de conexión).
  # ──────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg17
    container_name: calzado_jyr_db
    restart: unless-stopped

    environment:
      # ¿Por qué variables de entorno y no valores directos?
      # Seguridad: el docker-compose.yml se versiona en git.
      # Las credenciales reales van solo en el .env (ignorado por git).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # Solo loopback: accesible desde el desarrollador local, nunca desde la red
      # (en producción no se expone este puerto — docker-compose.prod.yml)
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      # Volumen nombrado: los datos sobreviven `docker compose down`.
      # Sin este volumen, cada `down` borra toda la BD.
      - calzado_jyr_data:/var/lib/postgresql/data
      # Scripts .sql en este directorio se ejecutan al crear el contenedor
      # por primera vez (orden alfabético). Son idempotentes (IF NOT EXISTS).
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # pg_isready verifica que PostgreSQL acepta conexiones TCP en el puerto.
      # interval: cada 10s intenta; retries: 5 intentos antes de "unhealthy".
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - calzado_jyr_net

  # ──────────────────────────────────────────────────────────
  # 🚀 be — Backend FastAPI: API REST para el frontend + ORM a
  #     PostgreSQL. Arranca tras el healthcheck de la BD y el
  #     volumen ./be:/app habilita --reload automático.
  # ──────────────────────────────────────────────────────────
  be:
    build:
      context: ./be
      dockerfile: Dockerfile
      # target: dev usa el stage "dev" del Dockerfile (hot-reload).
      # Cambiar a "prod" para despliegue (workers múltiples, sin reload).
      target: dev
    container_name: calzado_jyr_be
    restart: unless-stopped

    depends_on:
      db:
        # service_healthy: espera al healthcheck exitoso, NO solo al start.
        # Diferencia crítica: el contenedor puede estar "running" pero
        # PostgreSQL aún inicializando — service_healthy lo resuelve.
        condition: service_healthy

    environment:
      # ¿Por qué "db" como host y no "localhost"?
      # Dentro de la red Docker, los servicios se comunican por nombre.
      # "db" es el nombre del servicio definido arriba.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-3650}

      MAIL_SERVER: ${MAIL_SERVER:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-notificaciones@calzadojyr.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Calzado J&R}

      # El frontend necesita coincidir: CORS solo permitirá esta URL.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      # Entorno: development (imprime emails en consola) | production (envía SMTP real)
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # IA — Fase 0/1 (Groq/Gemini/Ollama)
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-512}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-768}

    ports:
      - "127.0.0.1:${BE_PORT:-8000}:8000"

    volumes:
      # Montar el código fuente para hot-reload (solo en dev).
      # En producción el código se copia dentro de la imagen (stage prod).
      - ./be:/app
      # IA — conocimiento para RAG (CONOCIMIENTO_SISTEMA_PARA_IA.md)
      - ./docs:/app/docs:ro

    networks:
      - calzado_jyr_net

  # ──────────────────────────────────────────────────────────
  # 📧 mailpit — Servidor de correo de prueba (web http://localhost:8025)
  # ──────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: calzado_jyr_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025" # Interfaz Web (solo loopback)
      - "127.0.0.1:1025:1025" # SMTP (solo loopback)
    networks:
      - calzado_jyr_net

  # ──────────────────────────────────────────────────────────
  # 🌐 fe — Frontend React 19 + Vite: HMR al guardar; el mount
  #     ./fe:/app usa /app/node_modules como volumen anónimo para
  #     preservar los módulos instalados en la imagen.
  # ──────────────────────────────────────────────────────────
  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      target: dev
    container_name: calzado_jyr_fe
    restart: unless-stopped

    depends_on:
      - be

    environment:
      # Vite expone variables VITE_* al código del navegador (public).
      # El navegador (host) necesita localhost para conectarse al backend.
      # IMPORTANTE: Vite en dev server reemplaza estas variables al compilar.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      # axios usa URLs relativas y Vite proxea /api -> be:8000 (sin CORS).
      VITE_USE_PROXY: "true"

    ports:
      - "127.0.0.1:${FE_PORT:-5173}:5173"

    volumes:
      - ./fe:/app
      # ¿Por qué este volumen anónimo en node_modules?
      # El volumen ./fe:/app monta el directorio del host dentro del
      # contenedor. Si node_modules no existe en el host, Docker lo
      # crea vacío y tapa los que instaló pnpm durante el build.
      # Este volumen anónimo "protege" node_modules del override.
      - /app/node_modules

    networks:
      - calzado_jyr_net

  # ──────────────────────────────────────────────────────────
  # 🤖 ollama — LLM local opcional (Llama 3.2 3B, dev offline):
  #     `docker compose --profile ollama up -d` + AI_PROVIDER=ollama
  # ──────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: calzado_jyr_ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - calzado_jyr_net

# ──────────────────────────────────────────────────────────
# 🔗 Red interna privada: bridge aislada para este proyecto;
#    db solo accesible desde be, sin exposición externa.
# ──────────────────────────────────────────────────────────
networks:
  calzado_jyr_net:
    driver: bridge

# ──────────────────────────────────────────────────────────
# 📦 Volúmenes nombrados: persistencia de datos de PostgreSQL;
#    `down` conserva datos, `down -v` los borra (reset).
# ──────────────────────────────────────────────────────────
volumes:
  calzado_jyr_data:
  ollama_data:
